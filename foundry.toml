[profile.default]
src = "src"
out = "out"
libs = ["lib"]
allow_paths = ["lib"]

remappings = [
    "openzeppelin-contracts-05/=lib/openzeppelin-contracts-05/contracts/",
    "openzeppelin-contracts-06/=lib/openzeppelin-contracts-06/contracts/",
    "openzeppelin-contracts-08/=lib/openzeppelin-contracts-08/contracts/"
]

fs_permissions = [
    { access = "read-write", path = "./.anvil" }
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
